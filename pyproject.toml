[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "bali-content-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "uvicorn==0.42.0"]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1"]
[project.scripts]
bali = "cli.main:main"
[tool.setuptools.packages.find]
include = ["app*", "cli*"]
