<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bali Content OS</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101b1a;color:#eee8d8}*{box-sizing:border-box}body{margin:0}header{padding:30px 5%;border-bottom:1px solid #33413a;display:flex;justify-content:space-between;align-items:center}small{color:#a9b7a6;letter-spacing:.15em}h1{font:36px Georgia;margin:10px 0}nav{padding:20px 5%;display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;background:#23332d;border:1px solid #4a5c4c;border-radius:30px;color:#eee8d8;padding:10px 18px}button[aria-pressed=true]{background:#dfb87b;color:#16251d}main{padding:10px 5% 60px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card{background:#1d2c26;border:1px solid #39483b;padding:24px;border-radius:14px}.number{font:36px Georgia;color:#e8bd7e}table{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}td,th{padding:14px;text-align:left;border-bottom:1px solid #39483b;vertical-align:top}section{overflow:auto}p{line-height:1.6;color:#bac5b7}input{background:#1d2c26;color:white;border:1px solid #62735f;padding:12px;width:min(100%,500px);border-radius:8px}.tag{color:#e8bd7e}pre{white-space:pre-wrap}#error{color:#ffb9a6}
</style><header><div><small>VIKTOR WANG · RETURN TO BALI</small><h1>Bali Content OS</h1></div><span class="tag">Season 01 / Local workspace</span></header><nav id="nav"></nav><main><div id="error" role="alert"></div><section id="view">Загрузка…</section></main>
<script>
const tabs=['Overview','Experiments','Pipeline','Winners','Content DNA','Leads','Revenue'];let data,active='Overview';
const el=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};
function table(rows,fields){if(!rows.length)return el('p','Пока нет данных. Новые результаты появятся после выполнения CLI-команд.');const t=document.createElement('table'),head=t.createTHead().insertRow();fields.forEach(k=>head.append(el('th',k)));const body=t.createTBody();rows.forEach(r=>{const row=body.insertRow();fields.forEach(k=>row.append(el('td',typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'—')))});return t}
function draw(){const v=document.querySelector('#view');v.replaceChildren(el('h2',active));document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.textContent===active));
if(active==='Overview'){const c=el('div','');c.className='cards';const labels={experiments:'Эксперименты',published:'Публикации',reach:'Охват',follows:'Подписки',qualified_leads:'Квалифицированные заявки',revenue:'Выручка',winners:'Победители'};Object.entries(data.overview).forEach(([k,n])=>{const a=el('div','');a.className='card';const num=el('div',n);num.className='number';a.append(num,el('p',labels[k]));c.append(a)});v.append(c,el('h2','Сегодня'));Object.entries(data.today).forEach(([k,val])=>{v.append(el('h3',k),el('p',typeof val==='string'?val:val.length?val.map(x=>typeof x==='string'?x:x.id+' · '+x.hypothesis).join('\n'):'Очередь пуста'))});}
if(active==='Experiments'){const input=el('input','');input.placeholder='Найти гипотезу, ID или pillar';input.setAttribute('aria-label','Поиск экспериментов');const wrap=el('div','');const render=()=>wrap.replaceChildren(table(data.experiments.filter(r=>JSON.stringify(r).toLowerCase().includes(input.value.toLowerCase())),['id','hypothesis','pillar','status','duration']));input.oninput=render;v.append(input,wrap);render()}
if(active==='Pipeline'){v.append(table(data.experiments,['id','status','hook']),el('h3','Очередь публикации'),table(data.publications,['id','status','approved_at','published_at']))}
if(active==='Winners')v.append(el('p','Порог: 1 000 reach, score ≥ 120, минимум 3 измеренных эксперимента.'),table(data.scores.filter(r=>r.winner),['id','score','lead_score','reach']));
if(active==='Content DNA')Object.entries(data.dna).forEach(([k,rows])=>v.append(el('h3',k),table(rows,['name','score','samples'])));
if(active==='Leads')v.append(el('p','Агрегированные метрики по экспериментам; персональные данные гостей здесь не хранятся.'),table(data.scores,['id','dms','applications','qualified_leads','lead_score']));
if(active==='Revenue')v.append(el('p','Все суммы должны быть в одной валюте. Нули означают введённые или отсутствующие метрики.'),table(data.scores,['id','sales','revenue','revenue_per_10k_reach']));}
tabs.forEach(t=>{const b=el('button',t);b.onclick=()=>{active=t;draw()};document.querySelector('#nav').append(b)});
fetch('/api/state').then(r=>{if(!r.ok)throw Error('API '+r.status);return r.json()}).then(d=>{data=d;draw()}).catch(e=>{document.querySelector('#view').replaceChildren();document.querySelector('#error').textContent='Не удалось загрузить данные: '+e.message});
</script></html>
